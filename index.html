<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PocketShop Bot</title>
    
    <!-- Подключаем внешний файл стилей -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Подключаем официальное SDK Bastyon -->
    <script src="https://bastyon.com"></script>
    
    <!-- Подключаем логику приложения -->
    <script src="app.js"></script>
</head>
<body>

    <div id="chat-container">
        <!-- Окно лога переписки бота и пользователя -->
        <div id="chat-log"></div>
        
        <!-- Кнопочная клавиатура бота -->
        <div id="keyboard-container"></div>

        <!-- Панель Администратора (слой поверх чата) -->
        <div id="admin-screen">
            <div class="admin-header">
                <h2>⚙️ Панель управления магазином</h2>
                <button class="btn-close" onclick="showMainMenu()">❌ Закрыть</button>
            </div>
            
            <div class="admin-section">
                <h3>➕ Добавить товар</h3>
                <div class="admin-input-group">
                    <input type="text" id="p-name" placeholder="Название товара">
                    <input type="number" id="p-price" step="0.001" placeholder="Цена в PKOIN">
                    <input type="number" id="p-qty" placeholder="Количество">
                    <button class="btn-admin" onclick="addProduct()">Добавить</button>
                </div>
            </div>

            <div class="admin-section">
                <h3>📦 Текущий каталог</h3>
                <div id="admin-catalog-list"></div>
            </div>

            <div class="admin-section">
                <h3>📜 Оплаченные заказы</h3>
                <div id="admin-orders-list"></div>
            </div>
        </div>
    </div>

</body>
</html>
